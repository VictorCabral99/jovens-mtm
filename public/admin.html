<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Notificações</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-bold mb-4">Enviar Notificação</h2>
    <input id="titulo" type="text" placeholder="Título" class="border p-2 w-full mb-4 rounded" />
    <textarea id="mensagem" placeholder="Mensagem" class="border p-2 w-full mb-4 rounded"></textarea>
    <button id="btnEnviar" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full">
      Enviar 🚀
    </button>
  </div>

  <script src="admin.js"></script>
</body>
</html>
